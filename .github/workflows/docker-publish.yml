name: Docker Publish

# Pushes to master publish fdebijl/nosedits:latest and :sha-<short> to Docker Hub.
# Pushes to any other branch only build the image, as a smoke test for the Dockerfile.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME  Docker Hub account name
#   DOCKERHUB_TOKEN     Docker Hub access token with Read/Write scope

on:
  push:
  workflow_dispatch:

permissions: {}

env:
  IMAGE: fdebijl/nosedits
  PUBLISH: ${{ github.ref == 'refs/heads/master' }}

concurrency:
  group: docker-publish-${{ github.ref }}
  # Never cancel a publish mid-flight, a half-pushed tag set is worse than a redundant build
  cancel-in-progress: false

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: prod
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Single-platform builds with provenance produce an OCI index, which Docker Hub shows as an "unknown/unknown" architecture
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
